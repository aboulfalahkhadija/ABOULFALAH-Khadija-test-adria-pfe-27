server:
  port: 8081

spring:
  application:
    name: account-service
  cloud:
    discovery:
      enabled: true
    config:
      enabled: false
  ai:
    mcp:
      server:
        protocol: streamable
  datasource:
    url: jdbc:h2:mem:account-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
