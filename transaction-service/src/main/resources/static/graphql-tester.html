<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GraphiQL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; color: #3b4b68; height: 100vh; display: flex; }
        .sidebar { width: 52px; background: #f6f8fa; border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 18px; }
        .sidebar-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #586069; font-size: 18px; cursor: pointer; }
        .sidebar-icon.active { background: #e1e4e8; color: #e535ab; }
        .workspace { flex: 1; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
        .editor-col { border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; background: #ffffff; }
        .top-bar { height: 48px; border-bottom: 1px solid #e1e4e8; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fafbfc; }
        .tab { background: #ffffff; border: 1px solid #e1e4e8; border-bottom: none; padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 6px 6px 0 0; margin-top: 10px; color: #24292e; }
        .run-btn { width: 36px; height: 36px; border-radius: 50%; background: #e535ab; border: none; color: white; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(229,53,171,0.3); }
        .run-btn:hover { background: #c82392; }
        .code-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; }
        .line-nums { width: 40px; padding: 16px 8px; text-align: right; color: #959da5; font-family: Consolas, monospace; font-size: 14px; line-height: 1.5; background: #fafbfc; border-right: 1px solid #f0f0f0; user-select: none; }
        textarea { flex: 1; border: none; padding: 16px; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.5; color: #24292e; resize: none; outline: none; }
        .vars-panel { height: 120px; border-top: 1px solid #e1e4e8; display: flex; flex-direction: column; }
        .vars-header { padding: 6px 16px; font-size: 12px; font-weight: 600; color: #586069; background: #fafbfc; border-bottom: 1px solid #e1e4e8; text-transform: uppercase; }
        .result-col { background: #f6f8fa; display: flex; flex-direction: column; overflow: hidden; }
        .result-header { height: 48px; border-bottom: 1px solid #e1e4e8; display: flex; align-items: center; padding: 0 16px; font-weight: 600; color: #e535ab; font-size: 16px; letter-spacing: -0.3px; }
        pre { flex: 1; padding: 16px; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.5; color: #032f62; overflow: auto; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-icon active" title="Documentation Explorer">📖</div>
    <div class="sidebar-icon" title="History">🕒</div>
    <div class="sidebar-icon" title="Re-fetch Schema">🔄</div>
</div>
<div class="workspace">
    <div class="editor-col">
        <div class="top-bar">
            <div class="tab">MyQuery</div>
            <button class="run-btn" onclick="executeGraphQL()" title="Execute query (Ctrl-Enter)">▶</button>
        </div>
        <div class="code-wrapper">
            <div class="line-nums">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12</div>
            <textarea id="query" spellcheck="false">query {
  transactions {
    id
    accountId
    amount
    currency
    merchantCategory
    country
    createdAt
  }
}</textarea>
        </div>
        <div class="vars-panel">
            <div class="vars-header">Variables &nbsp;&nbsp; Headers</div>
            <textarea id="variables" spellcheck="false"></textarea>
        </div>
    </div>
    <div class="result-col">
        <div class="result-header">GraphiQL</div>
        <pre id="response"></pre>
    </div>
</div>
<script>
    async function executeGraphQL() {
        const query = document.getElementById('query').value;
        let variables = {};
        try {
            const rawVars = document.getElementById('variables').value.trim();
            if (rawVars) variables = JSON.parse(rawVars);
        } catch (e) {}
        try {
            const res = await fetch('/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, variables })
            });
            const data = await res.json();
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        } catch (err) {
            document.getElementById('response').textContent = err.toString();
        }
    }
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') executeGraphQL();
    });
    executeGraphQL();
</script>
</body>
</html>
