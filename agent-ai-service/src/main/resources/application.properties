spring.application.name=agent-ai-service
server.port=8083

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0

spring.ai.mcp.client.streamable-http.connections.account-service.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=http://localhost:8082/mcp

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false
eureka.jersey.client.enabled=false


